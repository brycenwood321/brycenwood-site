<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #050508;
  font-family: 'Outfit', sans-serif;
  overflow: hidden;
  position: relative;
}
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;800;900&display=swap');

/* Grid background */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* Orbs */
.orb-1 {
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: #00ff88;
  filter: blur(140px);
  opacity: 0.06;
  top: -200px; left: -100px;
}
.orb-2 {
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: #0066ff;
  filter: blur(140px);
  opacity: 0.05;
  bottom: -150px; right: -100px;
}

.content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
  padding: 60px 80px;
}

.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #00ff88;
  margin-bottom: 20px;
}

h1 {
  font-family: 'Outfit', sans-serif;
  font-weight: 900;
  font-size: 72px;
  line-height: 1.05;
  letter-spacing: -2px;
  color: #e8e8f0;
  max-width: 800px;
}

h1 .accent {
  color: #00ff88;
  text-shadow: 0 0 40px rgba(0,255,136,0.3);
}

.sub {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  color: #8888a0;
  margin-top: 20px;
  max-width: 650px;
  line-height: 1.5;
}

.stats {
  display: flex;
  gap: 40px;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid #141620;
}

.stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  color: #00ff88;
}

.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  color: #55556a;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 4px;
}

.brand {
  position: absolute;
  bottom: 40px;
  right: 60px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #00ff88;
  opacity: 0.6;
}
</style>
</head>
<body>
<div class="orb-1"></div>
<div class="orb-2"></div>
<div class="content">
  <div class="eyebrow">Most owners use AI to rewrite emails</div>
  <h1>Run your business with AI.<br><span class="accent">Not just rewrite emails.</span></h1>
  <div class="sub">Custom business operating systems built with Claude Code. No developers. No agencies. No new hires.</div>
  <div class="stats">
    <div><div class="stat-val">$300K+</div><div class="stat-label">Revenue</div></div>
    <div><div class="stat-val">80+</div><div class="stat-label">Systems</div></div>
    <div><div class="stat-val">10</div><div class="stat-label">APIs</div></div>
    <div><div class="stat-val">0</div><div class="stat-label">Code Written</div></div>
  </div>
</div>
<div class="brand">BRYCENWOOD.COM</div>
</body>
</html>
